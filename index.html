<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Меню ресторана</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #222; /* основной фон */
    color: #fff;
    position: relative;
    overflow: hidden;
  }

  /* Большой золотой луч из верхнего правого угла */
  body::before {
    content: "";
    position: fixed;
    top: 0;
    right: 0;
    width: 600px;
    height: 600px;
    background: radial-gradient(
      ellipse at top right,
      rgba(212, 175, 55, 0.4),
      transparent 70%
    );
    transform: translate(50%, -50%) rotate(45deg);
    pointer-events: none;
    z-index: 0;
  }

  :root {
    --gold: #d4af37;
    --white: #ffffff;
    --black: #000000;
  }

  #categoryButton {
    display: block;
    width: 200px;
    height: 40px;
    margin: 10px auto;
    border: none;
    background-color: var(--gold);
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    text-align: center;
    line-height: 40px;
    border-radius: 4px;
    color: #000;
    position: relative;
    z-index: 1;
  }
  #categoryButton:hover {
    background-color: #b38a2a;
  }

  #categories {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin: 10px;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: opacity 0.5s, max-height 0.5s;
    position: relative;
    z-index: 1;
  }
  #categories.show {
    opacity: 1;
    max-height: 2000px;
  }

  .category-btn {
    padding: 10px 20px;
    margin: 5px;
    border-radius: 25px;
    border: 2px solid var(--gold);
    background-color: transparent;
    color: var(--gold);
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.3s, color 0.3s, transform 0.2s;
  }
  .category-btn.selected {
    background-color: var(--gold);
    color: #000;
  }

  .menu {
    padding: 20px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    min-height: 300px;
    position: relative;
    z-index: 1;
  }

  .dish-card {
    background-color: #111;
    border: 2px solid var(--gold);
    border-radius: 8px;
    width: 250px;
    margin: 10px;
    padding: 15px;
    box-shadow: 0 0 10px rgba(0,0,0,0.7);
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    transition: border-color 0.3s, box-shadow 0.3s, background-color 0.3s;
  }
  .dish-card.active,
  .dish-card.selected {
    border-color: var(--gold);
    box-shadow: 0 0 15px var(--gold);
    background-color: #222;
  }
  .dish-photo {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 4px;
    margin-bottom: 10px;
  }
  .dish-name {
    font-family: 'Arial Black', sans-serif;
    color: var(--gold);
    font-size: 20px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 8px;
  }
  .dish-name-english {
    font-family: 'Arial', sans-serif;
    color: var(--white);
    font-size: 16px;
    margin-bottom: 8px;
    text-align: center;
  }
  .dish-details {
    font-family: 'Arial', sans-serif;
    color: var(--white);
    font-size: 14px;
    text-align: center;
  }
</style>
</head>
<body>
<!-- Кнопка разворота -->
<button id="categoryButton">▼ РАЗДЕЛЫ МЕНЮ ▼</button>
<!-- Список категорий -->
<div id="categories"></div>
<!-- Меню -->
<div class="menu" id="menu"></div>
<script>
  const categoriesNames = [
    'СТАРТЕРЫ',
    'ПОКЕ',
    'САЛАТЫ',
    'ТАРТАРЫ',
    'ГОРЯЧИЕ И ХОЛОДНЫЕ ЗАКУСКИ',
    'УСТРИЧНЫЙ БАР',
    'БЛЮДА НА КОМПАНИЮ',
    'БРУСКЕТТЫ',
    'БУРГЕРЫ',
    'РОЛЛЫ',
    'СУПЫ',
    'ПАСТА',
    'ГАРНИРЫ',
    'ГОРЯЧИЕ БЛЮДА',
    'БЛЮДА НА ОГНЕ',
    'ДЕСЕРТЫ',
    'ХЛЕБ',
    'СОУСЫ'
  ];

  const categoryData = {
    'СТАРТЕРЫ': [
      {
        name: 'Оливки начиненные с сыром Фета',
        english: 'Olives stuffed with Feta cheese',
        weightPrice: '160 гр | 730р.',
        img: 'https://images.unsplash.com/photo-1604085207858-11b76e8bc8c7'
      },
      {
        name: 'Фирменный ростбиф под соусом вителло тоннато',
        english: 'Signature roast beef with vitello tonnato sauce',
        weightPrice: '185 гр | 1090р.',
        img: 'https://images.unsplash.com/photo-1590080875599-4a29b2a55d8d'
      },
      {
        name: 'Экзотические фрукты',
        english: 'Exotic fruits',
        weightPrice: '1500 гр | 2900р.',
        img: 'https://images.unsplash.com/photo-1574226516831-e1dff420e37e'
      },
      {
        name: 'Сырное ассорти (Горгондзола, Камамбер, Маасдам, Пармезан, Виноград, Мед)',
        english: 'Cheese platter (Gorgonzola, Camembert, Maasdam, Parmesan, grapes, honey)',
        weightPrice: '270 гр | 1490р.',
        img: 'https://images.unsplash.com/photo-1603280716474-80d7f0a1b8b7'
      }
    ],
    'ПОКЕ': [
      {
        name: 'Поке с лососем и авокадо',
        english: 'Salmon and avocado poke',
        weightPrice: '360 гр | 1090р.',
        img: 'https://images.unsplash.com/photo-1609417290692-2d4f7a5f8a7b'
      }
    ],
    'САЛАТЫ': [
      {
        name: 'Салат с баклажанами в соусе свит-чили',
        english: 'Eggplant salad with sweet chili sauce',
        weightPrice: '200 гр | 690р.',
        img: 'https://images.unsplash.com/photo-1571616174633-3933ef9d559e'
      }
    ],
    'ТАРТАРЫ': [
      {
        name: 'Тар-тар из говядины',
        english: 'Beef tartare',
        weightPrice: '150 гр | 890р.',
        img: 'https://images.unsplash.com/photo-1614438423770-7f1aeb4854b0'
      }
    ],
    'ГОРЯЧИЕ И ХОЛОДНЫЕ ЗАКУСКИ': [
      {
        name: 'Креветки в кляре с соусом васаби',
        english: 'Battered shrimp with wasabi sauce',
        weightPrice: '180 гр | 990р.',
        img: 'https://images.unsplash.com/photo-1601077331614-7b3a7514e2b8'
      }
    ],
    'УСТРИЧНЫЙ БАР': [
      {
        name: 'Устрица Императорская',
        english: 'Oyster Imperial',
        weightPrice: '1 шт | 580р.',
        img: 'https://images.unsplash.com/photo-1609761420272-9d7c9e16f5a4'
      }
    ],
    'БЛЮДА НА КОМПАНИЮ': [
      {
        name: 'Дегустационный сет под пенное',
        english: 'Tasting set to pair with beer',
        weightPrice: '520 гр / 90 гр | 3980р.',
        img: 'https://images.unsplash.com/photo-1613173387022-04b18150a3f8'
      }
    ],
    'БРУСКЕТТЫ': [
      {
        name: 'Брускетта с лососем и вялеными томатами',
        english: 'Bruschetta with salmon and sun-dried tomatoes',
        weightPrice: '120 гр | 690р.',
        img: 'https://images.unsplash.com/photo-1606804453198-2c4bc0f0a0e8'
      }
    ],
    // Остальные категории — пустые
    'БУРГЕРЫ': [],
    'РОЛЛЫ': [],
    'СУПЫ': [],
    'ПАСТА': [],
    'ГАРНИРЫ': [],
    'ГОРЯЧИЕ БЛЮДА': [],
    'БЛЮДА НА ОГНЕ': [],
    'ДЕСЕРТЫ': [],
    'ХЛЕБ': [],
    'СОУСЫ': []
  };

  const categoriesDiv = document.getElementById('categories');
  const menuDiv = document.getElementById('menu');

  // Создаем кнопки категорий
  categoriesNames.forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'category-btn';
    btn.textContent = name;
    btn.setAttribute('data-category', name);
    btn.addEventListener('click', () => {
      document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      showCategory(name);
      categoriesDiv.classList.remove('show');
    });
    categoriesDiv.appendChild(btn);
  });

  // Обработчик для кнопки раскрытия
  document.getElementById('categoryButton').addEventListener('click', () => {
    categoriesDiv.classList.toggle('show');
  });

  function showCategory(name) {
    // Очистка меню
    menuDiv.innerHTML = '';

    const dishes = categoryData[name] || [];

    dishes.forEach(dish => {
      const card = document.createElement('div');
      card.className = 'dish-card';

      card.innerHTML = `
        <img src="${dish.img}" alt="${dish.name}" class="dish-photo" />
        <div class="dish-name">${dish.name}</div>
        <div class="dish-name-english">${dish.english}</div>
        <div class="dish-details">${dish.weightPrice}</div>
      `;
      // Выделяем блюда по умолчанию
      card.classList.add('selected');
      card.addEventListener('click', () => {
        document.querySelectorAll('.dish-card').forEach(c => c.classList.remove('active', 'selected'));
        card.classList.add('active', 'selected');
      });
      menuDiv.appendChild(card);
    });
  }

  // При загрузке показывать только список категорий, блюд не отображать
  window.addEventListener('load', () => {
    // Показываем список категорий
    document.getElementById('categories').classList.add('show');
    // Не вызываем showCategory, чтобы блюда не отображались
  });
</script>
</body>
</html>
