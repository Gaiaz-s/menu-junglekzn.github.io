<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Меню ресторана</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #000;
    color: #fff;
  }
  :root {
    --gold: #d4af37;
    --white: #ffffff;
    --black: #000000;
  }
  /* Кнопка для разворачивания списка */
  #categoryButton {
    display: block;
    width: 200px;
    height: 40px;
    margin: 10px auto;
    border: none;
    background-color: var(--gold);
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    text-align: center;
    line-height: 40px;
    border-radius: 4px;
  }
  #categoryButton:hover {
    background-color: #b38a2a;
  }
  /* Контейнер для списка категорий */
  #categories {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin: 10px;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: opacity 0.5s, max-height 0.5s;
  }
  #categories.show {
    opacity: 1;
    max-height: 2000px;
  }
  /* Кнопки категорий */
  .category-btn {
    padding: 10px 20px;
    margin: 5px;
    border-radius: 25px;
    border: 2px solid var(--gold);
    background-color: transparent;
    color: var(--gold);
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.3s, color 0.3s, transform 0.2s;
  }
  .category-btn.selected {
    background-color: var(--gold);
    color: #000;
  }
  /* Меню */
  .menu {
    padding: 20px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    min-height: 300px;
  }
  /* Карточки блюд */
  .dish-card {
    background-color: #111;
    border: 2px solid var(--gold);
    border-radius: 8px;
    width: 250px;
    margin: 10px;
    padding: 15px;
    box-shadow: 0 0 10px rgba(0,0,0,0.7);
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    transition: border-color 0.3s, box-shadow 0.3s, background-color 0.3s;
  }
  /* выделение блюда — всегда золотое (по умолчанию) */
  .dish-card {
    border-color: var(--gold);
    box-shadow: 0 0 15px var(--gold);
    background-color: #222;
  }
  /* Фото блюда */
  .dish-photo {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 4px;
    margin-bottom: 10px;
  }
  /* Название блюда */
  .dish-name {
    font-family: 'Arial Black', sans-serif;
    color: var(--gold);
    font-size: 20px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 8px;
  }
  /* Английское название */
  .dish-name-english {
    font-family: 'Arial', sans-serif;
    color: var(--white);
    font-size: 16px;
    margin-bottom: 8px;
    text-align: center;
  }
  /* Граммовка и цена */
  .dish-details {
    font-family: 'Arial', sans-serif;
    color: var(--white);
    font-size: 14px;
    text-align: center;
  }
</style>
</head>
<body>
<!-- Кнопка разворота -->
<button id="categoryButton">▼ РАЗДЕЛЫ МЕНЮ ▼</button>
<!-- Список категорий -->
<div id="categories"></div>
<!-- Меню -->
<div class="menu" id="menu"></div>
<script>
  const categoriesNames = ['Закуски'];

  const categoryData = {
    'Закуски': [
      {
        name: 'Покé с лососем и авокадо',
        english: 'Salmon and avocado poke',
        weightPrice: '360 гр | 1090р.',
        img: 'https://images.unsplash.com/photo-1603006366543-3b8d7ed4b0d8'
      },
      {
        name: 'Салат с баклажанами в соусе свит-чили',
        english: 'Eggplant salad with sweet chili sauce',
        weightPrice: '200 гр | 690р.',
        img: 'https://images.unsplash.com/photo-1574226516831-e1dff420e37e'
      },
      {
        name: 'Тар-тар из говядины',
        english: 'Beef tartare',
        weightPrice: '150 гр | 890р.',
        img: 'https://images.unsplash.com/photo-1606945290626-8b3c8a9f5b4e'
      },
      {
        name: 'Креветки в кляре с соусом васаби',
        english: 'Battered shrimp with wasabi sauce',
        weightPrice: '180 гр | 990р.',
        img: 'https://images.unsplash.com/photo-1586480363394-5a60aefb8d58'
      },
      {
        name: 'Устрица Императорская',
        english: 'Oyster Imperial',
        weightPrice: '1 шт | 580р.',
        img: 'https://images.unsplash.com/photo-1603280716474-80d7f0a1b8b7'
      },
      {
        name: 'Дегустационный сет под пенное',
        english: 'Tasting set to pair with beer',
        weightPrice: '520 гр / 90 гр | 3980р.',
        img: 'https://images.unsplash.com/photo-1603280716474-80d7f0a1b8b7'
      },
      {
        name: 'Брускетта с лососем и вялеными томатами',
        english: 'Bruschetta with salmon and sun-dried tomatoes',
        weightPrice: '120 гр | 690р.',
        img: 'https://images.unsplash.com/photo-1609639172774-708e7a7a4b41'
      }
    ]
  };

  const categoriesDiv = document.getElementById('categories');
  const menuDiv = document.getElementById('menu');

  // Создаем кнопку категории
  categoriesNames.forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'category-btn';
    btn.textContent = name;
    btn.setAttribute('data-category', name);
    btn.addEventListener('click', () => {
      document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      showCategory(name);
      categoriesDiv.classList.remove('show');
    });
    categoriesDiv.appendChild(btn);
  });

  // Обработчик для кнопки раскрытия
  document.getElementById('categoryButton').addEventListener('click', () => {
    categoriesDiv.classList.toggle('show');
  });

  function showCategory(name) {
    // Очищаем меню
    menuDiv.innerHTML = '';

    const dishes = categoryData[name] || [];

    dishes.forEach(dish => {
      const card = document.createElement('div');
      card.className = 'dish-card';

     
      card.innerHTML = `
        <img src="${dish.img}" alt="${dish.name}" class="dish-photo" />
        <div class="dish-name">${dish.name}</div>
        <div class="dish-name-english">${dish.english}</div>
        <div class="dish-details">${dish.weightPrice}</div>
      `;
    
      menuDiv.appendChild(card);
    });
  }

  // Показываем первую категорию по умолчанию
  window.addEventListener('load', () => {
    showCategory(categoriesNames[0]);
    document.querySelector('.category-btn').classList.add('selected');
  });
</script>
</body>
</html>
