<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #222;
    color: #fff;
    position: relative;
    overflow: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    top: 0;
    right: 0;
    width: 600px;
    height: 600px;
    background: radial-gradient(
      ellipse at top right,
      rgba(212, 175, 55, 0.4),
      transparent 70%
    );
    transform: translate(50%, -50%) rotate(45deg);
    pointer-events: none;
    z-index: 0;
  }

  :root {
    --gold: #d4af37;
    --white: #ffffff;
    --black: #000000;
  }

  #categoryButton {
    display: block;
    width: 200px;
    height: 40px;
    margin: 10px auto;
    border: none;
    background-color: var(--gold);
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    text-align: center;
    line-height: 40px;
    border-radius: 4px;
    color: #000;
  }
  #categoryButton:hover {
    background-color: #b38a2a;
  }

  #categories {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin: 10px;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: opacity 0.5s, max-height 0.5s;
    position: relative;
    z-index: 1;
  }
  #categories.show {
    opacity: 1;
    max-height: 2000px;
  }

  .category-btn {
    padding: 10px 20px;
    margin: 5px;
    border-radius: 25px;
    border: 2px solid var(--gold);
    background-color: transparent;
    color: var(--gold);
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.3s, color 0.3s, transform 0.2s;
  }
  .category-btn.selected {
    background-color: var(--gold);
    color: #000;
  }

  .menu {
    padding: 20px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    min-height: 300px;
    max-height: 80vh;
    overflow-y: auto;
    position: relative;
    z-index: 1;
  }

  .dish-card {
    background-color: #111;
    border: 2px solid var(--gold);
    border-radius: 8px;
    width: 250px;
    margin: 10px;
    padding: 15px;
    box-shadow: 0 0 10px rgba(0,0,0,0.7);
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    transition: border-color 0.3s, box-shadow 0.3s, background-color 0.3s;
  }
  .dish-card.active,
  .dish-card.selected {
    border-color: var(--gold);
    box-shadow: 0 0 15px var(--gold);
    background-color: #222;
  }
  .dish-photo {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 4px;
    margin-bottom: 10px;
  }
  .dish-name {
    font-family: 'Arial Black', sans-serif;
    color: var(--gold);
    font-size: 20px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 8px;
  }
  .dish-name-english {
    font-family: 'Arial', sans-serif;
    color: var(--white);
    font-size: 16px;
    margin-bottom: 8px;
    text-align: center;
  }
  .dish-details {
    font-family: 'Arial', sans-serif;
    color: var(--white);
    font-size: 14px;
    text-align: center;
  }
</style>

  const categoriesDiv = document.getElementById('categories');
  const menuDiv = document.getElementById('menu');

  categoriesNames.forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'category-btn';
    btn.textContent = name;
    btn.setAttribute('data-category', name);
    btn.addEventListener('click', () => {
      document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      showCategory(name);
      categoriesDiv.classList.remove('show');
    });
    categoriesDiv.appendChild(btn);
  });

  document.getElementById('categoryButton').addEventListener('click', () => {
    categoriesDiv.classList.toggle('show');
  });

  function showCategory(name) {
    menuDiv.innerHTML = '';

    const dishes = categoryData[name] || [];

    dishes.forEach(dish => {
      const card = document.createElement('div');
      card.className = 'dish-card';

      card.innerHTML = `
        ${dish.img ? `<img src="${dish.img}" alt="${dish.name}" class="dish-photo" />` : ''}
        <div class="dish-name">${dish.name}</div>
        <div class="dish-name-english">${dish.english}</div>
        <div class="dish-details">${dish.weightPrice}</div>
      `;
      card.classList.add('selected');
      card.addEventListener('click', () => {
        document.querySelectorAll('.dish-card').forEach(c => c.classList.remove('active', 'selected'));
        card.classList.add('active', 'selected');
      });
      menuDiv.appendChild(card);
    });
  }

  window.addEventListener('load', () => {
    document.getElementById('categories').classList.add('show');
  });
